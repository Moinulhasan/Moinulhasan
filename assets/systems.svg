<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Three production systems and the hard problem inside each" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2228"/>
      <stop offset="1" stop-color="#0A181C"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="14" fill="url(#bg3)" stroke="#1D3B42"/>

  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDF2F0">in production, used by real people</text>
  <text x="840" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">the hard part</text>
  <line x1="40" y1="50" x2="840" y2="50" stroke="#1D3B42"/>

  <!-- row 1 -->
  <rect x="40" y="66" width="3" height="60" fill="#FF3B2F"/>
  <text x="60" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDF2F0">Rapid Pass top-up</text>
  <text x="60" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">Bangladesh Metro Rail — balance, history, SSLCommerz</text>
  <text x="60" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4E7078">Laravel · React · SSLCommerz</text>
  <text x="840" y="88" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FBEC3">a top-up must never double-credit,</text>
  <text x="840" y="106" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FBEC3">even when the gateway retries the callback</text>
  <line x1="40" y1="146" x2="840" y2="146" stroke="#152C32"/>

  <!-- row 2 -->
  <rect x="40" y="162" width="3" height="60" fill="#F0B429"/>
  <text x="60" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDF2F0">Star Cineplex</text>
  <text x="60" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">ticketing, food add-ons, virtual prepaid card</text>
  <text x="60" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4E7078">Laravel · MySQL · Redis · microservices</text>
  <text x="840" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FBEC3">one card spending online and at the counter,</text>
  <text x="840" y="202" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FBEC3">with seats held under a release deadline</text>
  <line x1="40" y1="242" x2="840" y2="242" stroke="#152C32"/>

  <!-- row 3 -->
  <rect x="40" y="258" width="3" height="60" fill="#35C08A"/>
  <text x="60" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDF2F0">BAT distributor ROI</text>
  <text x="60" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">route-level sales and expenses, asset shifting</text>
  <text x="60" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4E7078">Laravel · React · Redis</text>
  <text x="840" y="280" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FBEC3">commission rules that finance can change</text>
  <text x="840" y="298" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FBEC3">without anyone redeploying the engine</text>
</svg>
