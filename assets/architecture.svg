<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Request path: clients through Nginx and Laravel to queues, cache and the transactional ledger" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2228"/>
      <stop offset="1" stop-color="#0A181C"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2C525A"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F0B429"/>
    </marker>
    <path id="spine" d="M462 116 V 502"/>
    <path id="async" d="M792 392 H 820 V 278 H 798"/>
  </defs>

  <rect width="880" height="560" rx="14" fill="url(#bg2)" stroke="#1D3B42"/>

  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" fill="#EDF2F0">how a paid transaction moves through the systems I build</text>
  <line x1="40" y1="50" x2="840" y2="50" stroke="#1D3B42"/>

  <use href="#spine" fill="none" stroke="#173036" stroke-width="2"/>
  <use href="#spine" fill="none" stroke="#FF3B2F" stroke-width="2" stroke-dasharray="70 480" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="550" to="0" dur="3.6s" repeatCount="indefinite"/>
  </use>
  <circle r="4.5" fill="#FF3B2F">
    <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#spine"/></animateMotion>
  </circle>

  <use href="#async" fill="none" stroke="#4A4326" stroke-width="2" marker-end="url(#ar2)"/>
  <circle r="3.5" fill="#F0B429">
    <animateMotion dur="4.4s" repeatCount="indefinite" begin="1.4s"><mpath href="#async"/></animateMotion>
  </circle>
  <text transform="rotate(-90 846 336)" x="846" y="336" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#B08B2E">payment callback + job results</text>

  <text x="40" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">clients</text>
  <g fill="#12262B" stroke="#2C525A">
    <rect x="132" y="60" width="212" height="56" rx="8"/>
    <rect x="356" y="60" width="212" height="56" rx="8"/>
    <rect x="580" y="60" width="212" height="56" rx="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EDF2F0">
    <text x="148" y="86">Rapid Pass app</text>
    <text x="372" y="86">Cineplex web + app</text>
    <text x="596" y="86">Distributor dashboard</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">
    <text x="148" y="104">metro rail top-up</text>
    <text x="372" y="104">tickets, food, prepaid card</text>
    <text x="596" y="104">routes, commission, assets</text>
  </g>
  <g stroke="#2C525A" fill="none" marker-end="url(#ar)">
    <path d="M238 116 V 131 H 462 V 141"/>
    <path d="M686 116 V 131 H 462 V 141"/>
  </g>

  <text x="40" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">edge</text>
  <rect x="132" y="146" width="660" height="56" rx="8" fill="#12262B" stroke="#2C525A"/>
  <text x="148" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EDF2F0">Nginx on AWS EC2</text>
  <text x="148" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">TLS termination, rate limiting, static and S3 assets</text>
  <text x="776" y="182" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">CI/CD deploys here</text>

  <text x="40" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">application</text>
  <rect x="132" y="232" width="660" height="86" rx="8" fill="#12262B" stroke="#FF3B2F" stroke-opacity="0.5"/>
  <text x="148" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FF6A5E">Laravel API services</text>
  <g fill="#0E2228" stroke="#2C525A">
    <rect x="148" y="268" width="150" height="34" rx="6"/>
    <rect x="308" y="268" width="150" height="34" rx="6"/>
    <rect x="468" y="268" width="150" height="34" rx="6"/>
    <rect x="628" y="268" width="150" height="34" rx="6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9FBEC3">
    <text x="223" y="289" text-anchor="middle">auth + tokens</text>
    <text x="383" y="289" text-anchor="middle">payments</text>
    <text x="543" y="289" text-anchor="middle">ticketing</text>
    <text x="703" y="289" text-anchor="middle">commission engine</text>
  </g>

  <text x="40" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">async + state</text>
  <g fill="#12262B" stroke="#2C525A">
    <rect x="132" y="348" width="212" height="76" rx="8"/>
    <rect x="356" y="348" width="212" height="76" rx="8"/>
    <rect x="580" y="348" width="212" height="76" rx="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EDF2F0">
    <text x="148" y="374">Redis</text>
    <text x="372" y="374">RabbitMQ</text>
    <text x="596" y="374">Queue workers</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">
    <text x="148" y="394">cache and sessions</text>
    <text x="148" y="410">locks on balance writes</text>
    <text x="372" y="394">payment confirmations</text>
    <text x="372" y="410">receipts, notifications</text>
    <text x="596" y="394">retries with backoff</text>
    <text x="596" y="410">nothing blocks the user</text>
  </g>

  <text x="40" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">persistence</text>
  <g fill="#12262B" stroke="#2C525A">
    <rect x="132" y="464" width="324" height="56" rx="8"/>
    <rect x="468" y="464" width="324" height="56" rx="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EDF2F0">
    <text x="148" y="490">MySQL</text>
    <text x="484" y="490">MongoDB</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7A9BA1">
    <text x="148" y="508">the transactional ledger, source of truth</text>
    <text x="484" y="508">event history and audit trail</text>
  </g>

  <line x1="40" y1="536" x2="840" y2="536" stroke="#1D3B42"/>
  <text x="40" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">money is written once, synchronously, in one place. everything else becomes a job.</text>
</svg>
