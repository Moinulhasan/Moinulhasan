<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Md. Moinul Hasan Khan — backend architect, Dhaka" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2228"/>
      <stop offset="1" stop-color="#0A181C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B2F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF3B2F" stop-opacity="1"/>
      <stop offset="1" stop-color="#F0B429" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="880" height="250" rx="14"/></clipPath>
    <path id="trace" d="M 56 196 H 300 Q 316 196 316 182 V 168 Q 316 154 332 154 H 560 Q 576 154 576 168 V 196 H 824"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="250" fill="url(#plate)"/>

    <!-- ticket perforation edge -->
    <g fill="#0A181C">
      <circle cx="0" cy="125" r="11"/><circle cx="880" cy="125" r="11"/>
    </g>
    <g stroke="#1D3B42" stroke-width="1">
      <line x1="0" y1="46" x2="880" y2="46"/>
      <line x1="0" y1="222" x2="880" y2="222"/>
    </g>

    <!-- top status strip -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7A9BA1">
      <circle cx="30" cy="27" r="4" fill="#35C08A">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="46" y="31" fill="#9FBEC3">gateway</text>
      <text x="112" y="31" fill="#35C08A">healthy</text>
      <text x="196" y="31">queue: draining</text>
      <text x="332" y="31">cache: warm</text>
      <text x="452" y="31">region: dhaka</text>
      <text x="850" y="31" text-anchor="end" fill="#F0B429">SSL Wireless</text>
    </g>

    <!-- name + role -->
    <text x="56" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="34" fill="#EDF2F0" letter-spacing="-0.5">Md. Moinul Hasan Khan</text>
    <rect x="56" y="116" width="430" height="3" fill="url(#sweep)">
      <animate attributeName="width" from="0" to="430" dur="1.1s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="56" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#7A9BA1">backend architect — payments, ticketing, distribution systems</text>

    <!-- the trace this profile is about -->
    <use href="#trace" fill="none" stroke="#173036" stroke-width="2"/>
    <use href="#trace" fill="none" stroke="#FF3B2F" stroke-width="2" stroke-linecap="round"
         stroke-dasharray="150 1100" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="1250" to="0" dur="4.2s" repeatCount="indefinite"/>
    </use>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5F868D">
      <text x="56" y="216">request</text>
      <text x="316" y="216" text-anchor="middle">queue</text>
      <text x="576" y="216" text-anchor="middle">ledger</text>
      <text x="824" y="216" text-anchor="end">receipt</text>
    </g>
    <g fill="#0A181C" stroke="#2C525A" stroke-width="2">
      <circle cx="56" cy="196" r="5"/><circle cx="824" cy="196" r="5"/>
    </g>
    <circle r="4.5" fill="#F0B429">
      <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#trace"/>
      </animateMotion>
    </circle>

    <!-- footer meta -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5F868D">
      <text x="56" y="242">Laravel</text>
      <text x="126" y="242">PHP</text>
      <text x="174" y="242">Redis</text>
      <text x="234" y="242">RabbitMQ</text>
      <text x="320" y="242">MySQL</text>
      <text x="386" y="242">React</text>
      <text x="444" y="242">AWS</text>
      <text x="824" y="242" text-anchor="end" fill="#7A9BA1">5+ years shipping to production</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="249" rx="14" fill="none" stroke="#1D3B42"/>
</svg>
